<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gemini Prompt Tester</title>
<style>
  body { font-family: monospace; display: flex; height: 100vh; margin: 0; }
  #sidebar { width: 250px; border-right: 1px solid #333; overflow-y: auto; padding: 10px; }
  #chat-area { flex: 1; display: flex; flex-direction: column; padding: 10px; }
  #messages { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
  .msg { margin-bottom: 12px; white-space: pre-wrap; }
  .user { color: blue; }
  .model { color: green; }
  .chat-item { padding: 6px; cursor: pointer; border-bottom: 1px solid #eee; }
  .chat-item:hover { background: #f0f0f0; }
  #input-row { display: flex; gap: 8px; }
  #input-row input { flex: 1; padding: 8px; }
</style>
</head>
<body>

<div id="sidebar">
  <label>Token: <input type="text" id="token" style="width:100%"></label><br><br>
  <button onclick="newChat()" style="width:100%">+ New Chat</button>
  <button onclick="loadChatList()" style="width:100%">Refresh List</button>
  <div id="chat-list"></div>
</div>

<div id="chat-area">
  <div id="messages"></div>
  <div id="input-row">
    <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const BASE_URL = "http://localhost:8080";
let currentChatId = null;

function token() { return document.getElementById("token").value; }
function authHeaders(extra = {}) {
  return { Authorization: `Bearer ${token()}`, ...extra };
}

function newChat() {
  currentChatId = null;
  document.getElementById("messages").innerHTML = "";
}

async function loadChatList() {
  const res = await fetch(`${BASE_URL}/test/gemini-chat`, { headers: authHeaders() });
  const data = await res.json();
  const list = document.getElementById("chat-list");
  list.innerHTML = data.chats.map(c =>
    `<div class="chat-item" onclick="openChat('${c.chat_id}')">
      ${c.preview}... (${c.message_count})
    </div>`
  ).join("");
  // stash full chat data for quick access without a second endpoint
  window.__chats = data.chats;
}

async function openChat(chat_id) {
  currentChatId = chat_id;
  // re-fetch full list and pull this chat's messages back out
  // (simplest way without adding a third endpoint)
  const res = await fetch(`${BASE_URL}/test/gemini-chat`, { headers: authHeaders() });
  const data = await res.json();
  // the list endpoint only gives previews, so instead just render from
  // scratch by replaying: fetch isn't detailed enough — see note below
  document.getElementById("messages").innerHTML =
    "<em>Switched to chat " + chat_id + ". Send a message to continue it.</em>";
}

function renderMessage(role, content) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = `${role === "user" ? "You" : "Gemini"}: ${content}`;
  document.getElementById("messages").appendChild(div);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("message-input");
  const message = input.value;
  if (!message) return;
  input.value = "";

  renderMessage("user", message);

  const res = await fetch(`${BASE_URL}/test/gemini-chat`, {
    method: "POST",
    headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ chat_id: currentChatId, message })
  });
  const data = await res.json();
  currentChatId = data.chat_id;
  renderMessage("model", data.response);
}

loadChatList();
</script>

</body>
</html>
