info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/login
  body:
    type: json
    data: |-
      {
        "name": "Goshen009"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("access_token", res.body.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
