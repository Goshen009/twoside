services:
  twoside:
    container_name: twoside-app
    
    build:
      context: .
      target: dev

    user: "1001:1001"
      
    image: twoside:dev
    pull_policy: build
    
    tty: true
    
    ports:
      - "8080:8080"
      
    cap_drop:
      - ALL
      
    security_opt:
      - no-new-privileges:true
      
    read_only: true
    
    tmpfs:
      - /tmp
      - /app/dist
      - /.npm
      
    volumes:
      - ./src:/app/src:Z
      - ./node_modules:/app/node_modules:Z
      - ./package.json:/app/package.json:Z
      - ./package-lock.json:/app/package-lock.json:Z
      - ./tsconfig.json:/app/tsconfig.json:Z
      
    env_file:
      - .env