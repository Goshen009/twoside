<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Create a life you love - Login</title>
<!-- Load Tailwind CSS v3 with forms and container plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#121212',
            surface: '#1E232A',
            emeraldAccent: '#10B981',
            roseAccent: '#F87171',
            steelBlue: '#60A5FA',
            primaryText: '#F3F4F6',
            secondaryText: '#9CA3AF'
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-layout">
    /* Prevent bouncy pull-to-refresh & set base body background */
    body {
      background-color: #121212;
      color: #F3F4F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<style data-purpose="scrollbar-hidden">
    /* Hide scrollbars for clean native app appearance */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="min-h-screen bg-[#121212] flex items-center justify-center p-0 sm:p-4 selection:bg-[#10B981] selection:text-black">
<!-- BEGIN: Mobile App Container Frame -->
<div class="relative w-full max-w-[430px] min-h-screen sm:min-h-[890px] sm:max-h-[920px] bg-[#121212] sm:rounded-[44px] shadow-2xl overflow-y-auto no-scrollbar flex flex-col justify-between border-0 sm:border sm:border-[#9CA3AF]/10">
<!-- BEGIN: Top Masonry Collage Grid -->
<header class="relative w-full h-[320px] overflow-hidden select-none bg-[#121212] flex flex-col justify-end" data-purpose="topographic-header">
<!-- Topographic SVG Background & Contour Lines -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<!-- Subtle ambient radial gradient glows -->
<div class="absolute -top-10 -right-10 w-72 h-72 rounded-full bg-[#10B981]/10 blur-3xl pointer-events-none"></div>
<div class="absolute top-10 -left-10 w-64 h-64 rounded-full bg-[#1E232A]/80 blur-2xl pointer-events-none"></div>
<!-- Topographic contour paths SVG -->
<svg class="w-full h-full object-cover opacity-60" fill="none" preserveAspectRatio="none" viewBox="0 0 430 320" xmlns="http://www.w3.org/2000/svg">
<!-- Background fill shapes & contours inspired by contour map lines -->
<path d="M-20 40 C60 20, 130 90, 220 50 C310 10, 370 70, 450 30" fill="none" opacity="0.6" stroke="#1E232A" stroke-width="1.5"></path>
<path d="M-30 80 C80 50, 140 130, 240 80 C340 30, 390 110, 460 70" fill="none" stroke="#9CA3AF" stroke-opacity="0.15" stroke-width="1"></path>
<path d="M-10 110 C70 90, 160 160, 260 110 C360 60, 400 140, 460 100" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.2"></path>
<path d="M-40 150 C90 120, 170 200, 280 140 C380 90, 410 170, 470 130" fill="none" stroke="#9CA3AF" stroke-opacity="0.18" stroke-width="1"></path>
<path d="M-20 180 C80 160, 190 230, 290 170 C390 120, 420 200, 470 160" fill="none" opacity="0.8" stroke="#1E232A" stroke-width="2"></path>
<path d="M-30 220 C100 190, 210 260, 310 200 C410 150, 430 230, 480 190" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="1"></path>
<!-- Concentric contour elevation loops -->
<path d="M 180 90 C 230 60, 280 90, 270 130 C 260 170, 190 180, 160 150 C 130 120, 150 100, 180 90 Z" fill="none" stroke="#9CA3AF" stroke-opacity="0.2" stroke-width="1"></path>
<path d="M 190 105 C 220 85, 255 105, 250 130 C 240 155, 195 160, 175 142 C 155 125, 170 112, 190 105 Z" fill="#10B981" fill-opacity="0.03" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.2"></path>
<path d="M 205 118 C 220 105, 238 115, 235 128 C 230 140, 205 145, 195 135 C 188 127, 195 122, 205 118 Z" fill="none" stroke="#9CA3AF" stroke-opacity="0.25" stroke-width="1"></path>
<!-- Top right secondary nested contours -->
<path d="M 320 40 C 370 20, 420 40, 415 80 C 410 120, 360 120, 330 95 C 305 75, 300 50, 320 40 Z" fill="none" stroke="#9CA3AF" stroke-opacity="0.15" stroke-width="1"></path>
<path d="M 335 52 C 370 38, 402 52, 398 80 C 392 105, 360 105, 342 88 C 328 72, 320 60, 335 52 Z" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="1"></path>
<!-- Left organic ridge -->
<path d="M -10 90 C 40 80, 80 120, 70 160 C 60 190, 10 210, -20 190 Z" fill="none" stroke="#9CA3AF" stroke-opacity="0.15" stroke-width="1"></path>
</svg>
</div>
<!-- Smooth organic wave cut divider inspired by reference image -->
<div class="relative w-full z-10">
<svg class="w-full block h-20 -mb-1 text-[#121212] fill-current" preserveAspectRatio="none" viewBox="0 0 430 80" xmlns="http://www.w3.org/2000/svg">
<path d="M0 45 C120 75, 190 5, 310 18 C365 24, 400 38, 430 46 L430 80 L0 80 Z"></path>
</svg>
</div>
</header>
<!-- END: Top Masonry Collage Grid -->
<!-- BEGIN: Main Login Content Section -->
<main class="relative px-6 pb-6 flex-1 flex flex-col items-center z-20" data-purpose="auth-container">
<!-- Central Emerald Brand Logo Emblem -->
<div class="mb-4 flex items-center justify-center shadow-lg shadow-[#10B981]/25 ring-4 ring-[#121212] rounded-full mt-3">
<div class="w-14 h-14 rounded-full bg-[#10B981] flex items-center justify-center text-[#121212] transition-transform active:scale-95 duration-200">
<!-- Stylized Pinterest-inspired Monogram Icon -->
</div>
</div>
<!-- Headline -->
<h1 class="text-2xl sm:text-3xl font-extrabold text-[#F3F4F6] tracking-tight text-center mb-6">Ready to know where all your money went?</h1>
<!-- Authentication Form -->
<form action="#" class="w-full flex flex-col gap-3.5 max-w-sm" data-purpose="email-login-form" method="POST" onsubmit="event.preventDefault();">
<!-- Input Field Container -->
<div class="relative w-full bg-[#1E232A] rounded-2xl border border-[#9CA3AF]/20 px-4 py-2.5 focus-within:border-[#10B981] focus-within:ring-1 focus-within:ring-[#10B981] transition duration-200 opacity-60">
<label class="block text-xs font-medium text-[#9CA3AF]" for="email">
            Email
          </label>
<input autocomplete="email" class="w-full bg-transparent p-0 pt-0.5 border-none text-[#9CA3AF] text-base font-normal focus:ring-0 focus:outline-none cursor-not-allowed" id="email" name="email" readonly="" disabled="" type="email" value="example@google.com">
</div><div class="relative w-full bg-[#1E232A] rounded-2xl border border-[#9CA3AF]/20 px-4 py-2.5 focus-within:border-[#10B981] focus-within:ring-1 focus-within:ring-[#10B981] transition duration-200"><input autocomplete="one-time-code" class="w-full bg-transparent p-0 pt-0.5 border-none text-[#F3F4F6] placeholder-[#9CA3AF]/70 font-normal focus:ring-0 focus:outline-none tracking-widest text-center text-xl" id="otp" inputmode="numeric" maxlength="7" name="otp" placeholder="XXX XXX" required="" type="text"></div>
<!-- Primary CTA: Continue Button -->
<button class="w-full h-12 bg-[#10B981] hover:bg-[#0ea572] active:scale-[0.99] text-[#121212] font-bold text-base rounded-full shadow-lg shadow-[#10B981]/20 flex items-center justify-center transition duration-150 ease-in-out cursor-pointer" type="submit">Verify</button><p class="text-xs text-center text-[#9CA3AF] leading-relaxed mt-1">Didn't get a code? Try again in <button class="text-[#10B981] hover:underline font-medium cursor-pointer bg-transparent border-none p-0 inline" type="button">43 seconds</button> or <button class="text-[#10B981] hover:underline font-medium cursor-pointer bg-transparent border-none p-0 inline" type="button">change the email</button></p>
</form>
<!-- OR Divider -->
<!-- Social Login: Google CTA -->
<div class="w-full max-w-sm mb-6">
</div>
<!-- BEGIN: Footer Informational & Legal Notices -->
<footer class="w-full max-w-xs text-center flex flex-col gap-3 text-xs leading-relaxed" data-purpose="legal-footer">
<!-- Facebook Recovery Alert Notice -->
<!-- Terms of Service & Privacy Disclosure -->
<!-- iOS Bottom Indicator Mockup Spacing -->
<div class="w-32 h-1 bg-[#9CA3AF]/20 rounded-full mx-auto mt-3 hidden sm:block"></div>
</footer>
<!-- END: Footer Informational & Legal Notices -->
</main>
<!-- END: Main Login Content Section -->
</div>
<!-- END: Mobile App Container Frame -->


</body></html>
