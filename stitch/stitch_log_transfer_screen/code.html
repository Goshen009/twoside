<script>
  (function initTransferInteractions() {
    const amountInput = document.getElementById('transfer-amount');
    const feeInput = document.getElementById('transfer-fee');
    const totalDisplay = document.getElementById('total-display');
    const submitBtn = document.getElementById('submit-transfer-btn');

    function parseNumeric(val) {
      if (!val) return 0;
      const clean = val.replace(/[^0-9.]/g, '');
      const num = parseFloat(clean);
      return isNaN(num) ? 0 : num;
    }

    function updateTotal() {
      const amt = parseNumeric(amountInput.value);
      const fee = parseNumeric(feeInput.value);
      const total = amt + fee;
      totalDisplay.textContent = '₦' + total.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    amountInput?.addEventListener('input', updateTotal);
    feeInput?.addEventListener('input', updateTotal);

    submitBtn?.addEventListener('click', function () {
      const origText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4m-8-10H2m20 0h-4m-2.929-7.071l-2.828 2.828m-8.486 8.486l-2.828 2.828m0-14.142l2.828 2.828m8.486 8.486l2.828 2.828" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Logging...</span>';
      setTimeout(() => {
        submitBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Transferred!</span>';
        setTimeout(() => {
          submitBtn.innerHTML = origText;
        }, 1500);
      }, 600);
    });
  })();
</script>
