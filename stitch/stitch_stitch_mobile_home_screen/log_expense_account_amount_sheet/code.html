<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Log Expense - Account &amp; Amount Selector Sheet</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#10b981',
              dark: '#059669',
              light: '#34d399',
              glow: 'rgba(16, 185, 129, 0.25)',
            },
            deep: '#0c0e11',
            card: '#16181d',
            'card-soft': '#1a1d24',
            surface: '#1e222b',
            border: '#23272f',
            muted: '#9ca3af',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scrollbars-and-resets">
    /* Hide scrollbar for seamless native mobile feel */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0c0e11;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-[#0c0e11] text-[#f3f4f6] min-h-screen flex justify-center items-start antialiased select-none">
<!-- Mobile Viewport Mock Wrapper -->
<div class="relative w-full max-w-[420px] min-h-screen h-[100dvh] bg-[#0c0e11] overflow-hidden flex flex-col justify-end shadow-2xl">
<!-- BEGIN: BackgroundDimmedScreen -->
<!-- Mimicking background screen state from {{DATA:SCREEN:SCREEN_5}} with dimming & blur -->
<div class="absolute inset-0 z-0 px-5 pt-8 opacity-35 filter blur-[2px] pointer-events-none flex flex-col justify-start" data-purpose="background-context">
<!-- Status Bar Area -->
<div class="flex justify-between items-center text-xs font-semibold text-gray-400 mb-5 px-1">
<span class="">9:41</span>
<div class="flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
<span class="text-[10px]">5G</span>
<div class="w-5 h-2.5 border border-gray-400 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3/4 bg-gray-400 rounded-xs"></div>
</div>
</div>
</div>
<!-- Header -->
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path></svg>
</div>
<h1 class="text-xl font-bold tracking-tight text-white">Log Expense</h1>
</div>
<div class="w-8 h-8 rounded-full bg-[#16181d] border border-[#23272f] flex items-center justify-center text-gray-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
<!-- Description Block -->
<div class="space-y-1.5 mb-4">
<span class="text-[11px] font-bold tracking-wider text-gray-400 uppercase">DESCRIPTION</span>
<div class="h-12 bg-[#16181d] border border-[#23272f] rounded-xl px-3.5 flex items-center text-sm text-gray-200">
          Supermarket Groceries &amp; Toiletries
        </div>
</div>
<!-- Date & Time -->
<div class="space-y-1.5 mb-4">
<span class="text-[11px] font-bold tracking-wider text-gray-400 uppercase">DATE &amp; TIME</span>
<div class="h-12 bg-[#16181d] border border-[#23272f] rounded-xl px-3.5 flex items-center justify-between text-sm text-gray-200">
<span class="">Today, 02:15 PM</span>
<span class="text-xs text-gray-400">Change</span>
</div>
</div>
<!-- Category -->
<div class="space-y-1.5 mb-5">
<span class="text-[11px] font-bold tracking-wider text-gray-400 uppercase">CATEGORY</span>
<div class="h-12 bg-[#16181d] border border-[#23272f] rounded-xl px-3.5 flex items-center justify-between text-sm text-gray-200">
<span class="">Groceries &amp; Pantry</span>
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
</div>
</div>
<!-- END: BackgroundDimmedScreen -->
<!-- Dim Backdrop Overlay -->
<div aria-hidden="true" class="absolute inset-0 bg-black/60 z-10 backdrop-blur-[1px]"></div>
<!-- BEGIN: AccountAndAmountModalSheet -->
<section class="relative z-20 w-full bg-[#12141a] border-t border-[#23272f] rounded-t-[32px] pt-3 pb-8 px-5 flex flex-col max-h-[92vh] overflow-y-auto shadow-2xl animate-fade-in" data-purpose="bottom-sheet-modal">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-[#2c313c] rounded-full mx-auto mb-3.5"></div>
<!-- Modal Header -->
<header class="flex items-center justify-between pb-3.5 border-b border-[#23272f]/70"><h2 class="text-base font-bold text-white tracking-tight">Select account &amp; amount</h2>
<button aria-label="Close sheet" class="w-8 h-8 rounded-full bg-[#1c2029] border border-[#272c38] flex items-center justify-center text-gray-400 hover:text-white hover:bg-[#252b37] transition-colors" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button></header>
<!-- Expense Allocation Progress Indicator -->

<!-- Account Selection List -->

<!-- BEGIN: AmountAndFeeConfiguration -->
<!-- Dedicated Card for Amount Allocation & Fees -->
<div class="mt-4 p-3.5 bg-[#171b24] border border-[#282e3b] rounded-2xl space-y-3.5" data-purpose="amount-deduction-card"><div>
<div class="flex justify-between items-center mb-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Source Account</label>
<span class="text-[10px] text-gray-400 cursor-pointer">Change</span>
</div>
<div class="w-full h-12 bg-[#101217] border border-[#272d3b] hover:border-gray-600 rounded-xl px-3.5 flex items-center justify-between cursor-pointer transition-all" role="button" tabindex="0" aria-label="Source Account: OPay Wallet">
<div>
<p class="text-sm font-semibold text-white leading-tight">OPay Wallet</p>
<p class="text-[11px] text-gray-400 mt-0.5">₦34,567.90</p>
</div>
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
</div>
</div>
<div class="pt-2 border-t border-[#232834]">
<div class="flex justify-between items-center mb-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-gray-400" for="deduct-amount">Amount</label>
</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-base font-bold text-gray-400">₦</span>
<input class="w-full h-11 bg-[#101217] border border-[#272d3b] focus:border-brand focus:ring-1 focus:ring-brand rounded-xl pl-8 pr-3.5 text-base font-bold text-white tracking-tight" id="deduct-amount" type="text" value="10,000.00">
</div>
</div>
<div class="pt-2 border-t border-[#232834]">
<div class="flex justify-between items-center mb-1.5">
<label class="text-[11px] font-bold uppercase tracking-wider text-gray-400" for="fee-amount">Fee (Optional)</label>
</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-sm font-medium text-gray-400">₦</span>
<input class="w-full h-10 bg-[#101217] border border-[#272d3b] focus:border-brand focus:ring-1 focus:ring-brand rounded-xl pl-8 pr-3.5 text-sm text-gray-200 tracking-tight" id="fee-amount" placeholder="0.00" type="text" value="0.00">
</div>
</div></div>
<!-- END: AmountAndFeeConfiguration -->
<!-- Split / Multi-account Toggle Suggestion -->

<!-- BEGIN: BottomActionSection -->
<footer class="mt-5 space-y-3 pt-3 border-t border-[#23272f]"><button class="w-full py-3.5 bg-brand hover:bg-brand-dark active:scale-[0.99] text-gray-950 font-bold text-sm rounded-xl shadow-lg shadow-brand/20 flex items-center justify-center transition-all cursor-pointer" type="button">
Confirm
</button></footer>
<!-- END: BottomActionSection -->
<!-- iOS Home Indicator bar -->

</section>
<!-- END: AccountAndAmountModalSheet -->
</div>


</body></html>
